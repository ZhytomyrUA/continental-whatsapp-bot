name: Continental WhatsApp Channel News

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: continental-whatsapp-news
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news collector
        run: python bot.py

      - name: Persist generated posts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whatsapp_posts.json whatsapp_posts.txt whatsapp_seen.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state/output changes to commit."
            exit 0
          fi

          git commit -m "chore: update WhatsApp Channel news"
          git push origin HEAD:${GITHUB_REF_NAME}
